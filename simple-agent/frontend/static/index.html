<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Pantry - AI Kitchen & Inventory Assistant</title>
<!-- Google Fonts: Inter & Material Symbols Outlined -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #059669;
    --accent-dark: #047857;
    --accent-light: #d1fae5;
    --accent-glow: rgba(5, 150, 105, 0.15);
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --border: #e5e7eb;
    --text-main: #1f2937;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #ecfdf5 0%, var(--bg) 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: var(--text-main);
  }
  
  .chat-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 820px;
    height: 94vh;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    border: 1px solid rgba(229, 231, 235, 0.8);
    overflow: hidden;
  }

  header {
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
    color: #fff;
    padding: 1.1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 12px rgba(4, 120, 87, 0.15);
  }
  
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  
  .header-icon {
    background: rgba(255, 255, 255, 0.2);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  
  .header-title {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    background: rgba(255, 255, 255, 0.15);
    padding: 0.3rem 0.7rem;
    border-radius: 20px;
    font-weight: 500;
  }
  
  .status-dot {
    width: 8px;
    height: 8px;
    background-color: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 8px #34d399;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    background: #fafafa;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadeIn 0.2s ease-in-out;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  
  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }
  
  .msg-author {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
    font-weight: 600;
    padding: 0 0.2rem;
  }

  .bubble {
    padding: 0.85rem 1.1rem;
    border-radius: 16px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text-main);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* --- Quick prompt pills --- */
  .prompts {
    display: flex;
    gap: 0.6rem;
    padding: 0.75rem 1.25rem 0.25rem;
    overflow-x: auto;
    flex-wrap: wrap;
    justify-content: center;
    background: #ffffff;
    border-top: 1px solid rgba(229, 231, 235, 0.5);
  }

  .prompt-btn {
    background: var(--accent-light);
    border: 1px solid #a7f3d0;
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--accent-dark);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .prompt-btn:hover {
    background: #059669;
    color: #ffffff;
    border-color: #059669;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px var(--accent-glow);
  }

  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.25rem 1.25rem;
    background: #ffffff;
    border-top: 1px solid var(--border);
    align-items: center;
  }

  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: #f9fafb;
  }

  input:focus {
    border-color: var(--accent);
    background: #ffffff;
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  button.send-btn {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  button.send-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(5, 150, 105, 0.25);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:14px; padding:1.1rem; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.05); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.45; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; color:var(--text-main); }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; color:var(--text-main); }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; color:var(--text-main); }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; color:var(--text-main); }
  .a2text.a2-caption { font-size:.85rem; color:var(--text-muted); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:10px; display:block; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>

<div class="chat-container">
  <header>
    <div class="header-brand">
      <div class="header-icon">
        <span class="material-symbols-outlined" style="color:#fff; font-size:1.4rem;">kitchen</span>
      </div>
      <h1 class="header-title">Smart Pantry</h1>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      Online
    </div>
  </header>

  <div id="log"></div>

  <div class="prompts">
    <button type="button" class="prompt-btn" onclick="sendPrompt('Show my pantry inventory')">📋 Pantry Inventory</button>
    <button type="button" class="prompt-btn" onclick="sendPrompt('Suggest a recipe with my ingredients')">🍳 Recipe Ideas</button>
    <button type="button" class="prompt-btn" onclick="sendPrompt('Calculate nutrition for 200g grilled chicken')">🥗 Nutrition Calculator</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask Smart Pantry anything…" autocomplete="off" autofocus>
    <button class="send-btn">
      Send
      <span class="material-symbols-outlined" style="color:#fff; font-size:1.1rem;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.requestSubmit();
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const author = el("div", "msg-author", who === "user" ? "You" : "🤖 Smart Pantry");
  const b = el("div", "bubble");
  m.appendChild(author);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
